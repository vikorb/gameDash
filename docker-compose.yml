services:
  db:
    image: postgres:15-alpine
    container_name: gamedash_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: root
      POSTGRES_DB: gameDash
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gameDash"]
      interval: 5s
      timeout: 5s
      retries: 5

  pocketbase:
    build: ./pocketbase
    container_name: gamedash_pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
    environment:
      POCKETBASE_ADMIN_EMAIL: admin@example.com
      POCKETBASE_ADMIN_PASSWORD: admin123456
      POCKETBASE_ENCRYPTION_KEY: k8mP9xR2vL5wN7qT4yU6hJ3nB8cF1dG0sA9eZ7iO5pM2
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: gamedash_back
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgres://user:root@db:5432/gameDash
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure 

  frontend:
    build: ./frontend
    container_name: gamedash_front
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_POCKETBASE_URL: http://localhost:8090
    depends_on:
      - backend
      - pocketbase

volumes:
  pocketbase_data: