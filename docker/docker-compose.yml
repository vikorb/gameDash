services:
  db:
    image: postgres:16
    container_name: gamedash_db
    environment:
      POSTGRES_DB: gamedash
      POSTGRES_USER: gamedash
      POSTGRES_PASSWORD: gamedash
    ports:
      - '5433:5432'
    volumes:
      - gamedash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamedash']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    container_name: gamedash_backend
    env_file:
      - ../backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'

  frontend:
    build: ..
    container_name: gamedash_frontend
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  gamedash_pgdata:
