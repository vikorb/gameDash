services:
  db:
    image: public.ecr.aws/docker/library/postgres:15-alpine
    container_name: gamedash_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - gamedash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pocketbase:
    build: ./pocketbase
    container_name: gamedash_pocketbase
    volumes:
      - pocketbase_data:/pb_data
    environment:
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD}
      POCKETBASE_ENCRYPTION_KEY: ${POCKETBASE_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot : migrations + seed, puis s'arrete
  seed:
    build: ./backend
    container_name: gamedash_seed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: ${NODE_ENV}
      TS_NODE_TRANSPILE_ONLY: "1"
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run seed"
    restart: "no"

  backend:
    build: ./backend
    container_name: gamedash_back
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      TS_NODE_TRANSPILE_ONLY: "1"
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD}
    command: sh -c "npm run dev"
    depends_on:
      db:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: gamedash_front
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL}
    depends_on:
      - backend
      - pocketbase
    restart: unless-stopped

  # Reverse proxy : seul point expose, port 80
  proxy:
    image: nginx:1.27-alpine
    container_name: gamedash_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - pocketbase
    restart: unless-stopped

volumes:
  gamedash_db_data:
  pocketbase_data:
